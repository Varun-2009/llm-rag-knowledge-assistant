<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Grounded RAG assistant demo</title>
  <desc id="desc">A sample healthcare security question with a grounded answer, citations, and retrieval confidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="52" y="42" width="1096" height="636" rx="24" fill="#f8fafc" filter="url(#shadow)"/>
  <rect x="52" y="42" width="1096" height="84" rx="24" fill="#111827"/>
  <rect x="52" y="102" width="1096" height="24" fill="#111827"/>
  <circle cx="91" cy="84" r="8" fill="#ef4444"/><circle cx="119" cy="84" r="8" fill="#f59e0b"/><circle cx="147" cy="84" r="8" fill="#22c55e"/>
  <text x="184" y="92" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="700">Grounded Healthcare Knowledge Assistant</text>
  <rect x="88" y="158" width="1024" height="94" rx="16" fill="#e0e7ff"/>
  <text x="116" y="190" fill="#4338ca" font-family="Arial, sans-serif" font-size="15" font-weight="700">YOUR QUESTION</text>
  <text x="116" y="224" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="600">How is protected health information secured?</text>
  <rect x="88" y="278" width="1024" height="214" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="119" cy="316" r="15" fill="#14b8a6"/>
  <path d="M112 316l5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="323" fill="#0f766e" font-family="Arial, sans-serif" font-size="16" font-weight="700">GROUNDED ANSWER</text>
  <text x="116" y="365" fill="#1e293b" font-family="Arial, sans-serif" font-size="20">
    <tspan x="116" dy="0">Protected health information is encrypted in transit and at rest. Access follows</tspan>
    <tspan x="116" dy="32">least-privilege, role-based controls. Sensitive fields are masked in non-production</tspan>
    <tspan x="116" dy="32">environments, and audit logs record access to regulated datasets.</tspan>
  </text>
  <rect x="116" y="446" width="194" height="30" rx="15" fill="#ccfbf1"/>
  <text x="133" y="467" fill="#0f766e" font-family="Arial, sans-serif" font-size="14" font-weight="700">Grounded: YES</text>
  <rect x="88" y="518" width="660" height="120" rx="16" fill="#f1f5f9"/>
  <text x="116" y="550" fill="#475569" font-family="Arial, sans-serif" font-size="15" font-weight="700">CITATIONS</text>
  <text x="116" y="583" fill="#1e293b" font-family="Arial, sans-serif" font-size="17">1. security.txt — encryption, RBAC, masking and audit logging</text>
  <text x="116" y="614" fill="#1e293b" font-family="Arial, sans-serif" font-size="17">2. claims.txt — claim validation and quarantine controls</text>
  <rect x="776" y="518" width="336" height="120" rx="16" fill="#eef2ff"/>
  <text x="804" y="550" fill="#4338ca" font-family="Arial, sans-serif" font-size="15" font-weight="700">RETRIEVAL</text>
  <text x="804" y="590" fill="#111827" font-family="Arial, sans-serif" font-size="27" font-weight="700">Top match 0.71</text>
  <text x="804" y="618" fill="#64748b" font-family="Arial, sans-serif" font-size="15">TF-IDF + cosine similarity</text>
</svg>
