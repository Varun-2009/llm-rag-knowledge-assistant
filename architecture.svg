<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
<title>RAG pipeline architecture</title>
<desc>Flowchart showing documents flowing through chunking and embedding into a vector store, a user query being embedded and matched against the store, retrieved context being combined with the query, and sent to an LLM to produce a response.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="460" fill="#FFFFFF"/>

<g>
<rect x="40" y="40" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="115" y="60" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#2C2C2A">Source documents</text>
<text x="115" y="78" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#444441">PDFs, docs, text</text>
</g>

<g>
<rect x="260" y="40" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="335" y="60" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#04342C">Chunking</text>
<text x="335" y="78" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#085041">Split into segments</text>
</g>

<g>
<rect x="480" y="40" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="555" y="60" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#04342C">Embedding model</text>
<text x="555" y="78" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#085041">Text to vectors</text>
</g>

<line x1="190" y1="68" x2="258" y2="68" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="410" y1="68" x2="478" y2="68" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<path d="M555 96 L555 130 L335 130 L335 156" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="260" y="160" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="335" y="180" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#26215C">Vector store</text>
<text x="335" y="198" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#3C3489">Indexed chunks</text>
</g>

<g>
<rect x="40" y="280" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="115" y="300" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#2C2C2A">User query</text>
<text x="115" y="318" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#444441">Natural language</text>
</g>

<path d="M115 280 L115 240 L335 240 L335 218" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="260" y="280" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="335" y="300" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4A1B0C">Retrieval</text>
<text x="335" y="318" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#712B13">Top-k relevant chunks</text>
</g>

<line x1="335" y1="216" x2="335" y2="278" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="480" y="280" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="555" y="300" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4A1B0C">Prompt assembly</text>
<text x="555" y="318" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#712B13">Query + context</text>
</g>

<line x1="410" y1="308" x2="478" y2="308" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="260" y="380" width="150" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="335" y="400" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#412402">LLM</text>
<text x="335" y="418" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#633806">Generates answer</text>
</g>

<path d="M555 336 L555 408 L410 408" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

</svg>
